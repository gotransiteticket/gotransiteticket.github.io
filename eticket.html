<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GO TRANSIT TICKET</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Old+Italic&display=swap" rel="stylesheet">
<style>
:root{
    --ticket-bg: #1530B1; /* default blue */
    --text-on-ticket: #ffffff;
    --accent: #2D4CEB; /* line and circle */
}

body{
    font-family: "helvetica neue", Arial, sans-serif;
    background-color: var(--ticket-bg);
    margin:0;
    padding:0;
    color: #000;
    min-height:100vh;
}

/* ---------- ticket layout ---------- */
.ticket{
    max-width: 900px;
    margin: 0 auto;
    background: transparent;
    padding-bottom: 40px;
}

.header{
    background-color: var(--ticket-bg);
    position:relative;
    color:var(--text-on-ticket);
    padding: 30px 0px 20px 0px;
    text-align:center;
    border-bottom: 5px solid var(--accent);
}

.logo{
    width: 76px;
    margin-bottom:6px;
}

.scroll-container {
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    padding-bottom:20px;
    background-color: transparent;
    color: var(--text-on-ticket);
    font-family: "helvetica neue";
    font-size: 18px;
}

.scroll-text {
    display: inline-block;
    padding-left: 5%;
    animation: scroll-left 60s linear infinite;
}

@keyframes scroll-left {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}

.route{
    text-align:center;
    font-size: 14px;
    font-weight:normal;
    letter-spacing: 1px;
    color: var(--text-on-ticket);
}

.circlepos{
    position:absolute;
    width:17px;
    bottom: -10%;
    left: 50%;
    transform: translateX(-50%);
    background-color: var(--accent);
    border-radius: 50%;
    border: 3px solid white;
}

.trip-info{
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 20px 10px;
    background: white;
    border-bottom: 2px dotted #B3B6BB;
}

.trip-section{
    flex:1;
    color: #424951;
}

.boldtext{
    font-size: 46px;
    font-weight: 600;
    font-style: normal;
    padding-bottom: 5px;
}

.subtext{
    font-size:18px;
    padding-bottom: 5px;
    letter-spacing: 0.5px;
    font-weight: 500;
}

.ticket-details{
    text-align: center;
    padding: 10px;
    background: white;
    position: relative;
}

.ticket-number{
    font-size: 18px;
    font-weight: 300;
    padding-bottom: 20px;
    color:#424951;
}

.ticket-no{
    font-size: 18px;
}

.ticket-code{
    position: relative;
}

.activebg{
    padding: 6px 12px;
    background-color: white;
    display: inline-block;
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    border-radius:6px;
    z-index: 2; /* make sure ACTIVE is above barcode */
}

.status{
    color: var(--ticket-bg);
    font-size: 22px;
    font-family: "Noto Sans Old Italic", sans-serif;
    font-weight: 400;
    font-style: normal;
    -webkit-animation: fadeinout 10s linear infinite;
    animation: fadeinout 10s linear infinite;
}

@keyframes fadeinout {
    0%,100% { opacity: 0; }
    14%,86% { opacity: 1; }
}

.ticket-code svg{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* center barcode behind ACTIVE */
    z-index: 1;
}

.timers{
    display: flex;
    justify-content: space-between;
    padding: 10px 10px;
    align-items: center;
    text-align: center;
    background: white;
}

.timertitle{
    font-size: 11px;
    font-weight: 500;
    color:#424951;
}

.showtime{
    font-size: 18px;
    font-weight: 500;
    color:#424951;
}

.notice{
    background-color: var(--ticket-bg);
    text-align: center;
    font-size: 18px;
    font-weight: 300;
    color: var(--text-on-ticket);
    padding-top: 60px;
    padding-bottom: 10px;
}

.countdown{
    font-size: 38px;
    font-weight: 300;
    padding-top: 10px;
    padding-bottom: 60px;
    color: var(--text-on-ticket);
}

/* back button */
.back-wrapper{
    text-align:center;
    margin-top: 16px;
}
.btn {
    display:inline-block;
    padding:10px 18px;
    border-radius:8px;
    border: none;
    cursor:pointer;
    font-weight:600;
}

.btn-back {
    background: #fff;
    color: #333;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

/* ---------- modal overlay ---------- */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 250ms ease;
}

.overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.modal {
    background: #fff;
    width: 92%;
    max-width:520px;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    text-align: left;
}

.modal h2 { margin:0 0 12px 0; font-size:20px; }
.form-row { margin-bottom: 12px; }
label { display:block; font-size:13px; margin-bottom:6px; color:#333; font-weight:600; }

select {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #d6d6d6;
    font-size:15px;
}

.color-grid{
    display:flex;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
}

.color-swatch{
    width:44px;
    height:44px;
    border-radius:50%;
    border: 3px solid rgba(0,0,0,0.06);
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: transform 150ms ease, box-shadow 150ms ease;
}

.color-swatch.selected{
    outline: 3px solid #fff;
    transform: translateY(-4px);
    box-shadow: 0 8px 26px rgba(0,0,0,0.22);
}

.color-label { font-size:12px; text-align:center; margin-top:6px; color:#444; }

.row-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:10px; }

.btn-primary {
    background: var(--ticket-bg);
    color: #fff;
    border-radius:8px;
    padding:10px 16px;
    border:none;
    cursor:pointer;
    font-weight:700;
}

/* small responsiveness */
@media (max-width:520px){
    .boldtext { font-size: 36px; }
    .modal { padding:16px; }
}

</style>
</head>
<body>
<div class="ticket" id="ticketRoot">
    <!-- ... your ticket content remains the same ... -->
</div>

<!-- Fullscreen overlay modal -->
<div id="overlay" class="overlay">
    <!-- ... modal content same as original ... -->
</div>

<script>
  const currentTimeEl = document.getElementById("currentTime");
  const elapsedTimeEl = document.getElementById("elapsedTime");
  const countdownEl = document.getElementById("countdown");

  const PRESET_ELAPSED_SECONDS = (21 * 60) + 46;
  const TOTAL_COUNTDOWN_SECONDS = 4 * 60 * 60;

  const activationStart = new Date(Date.now() - PRESET_ELAPSED_SECONDS * 1000);
  const countdownSeconds = TOTAL_COUNTDOWN_SECONDS;

  function formatTime(s) {
    const h = String(Math.floor(s / 3600)).padStart(2, '0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    return `${h}:${m}:${sec}`;
  }

  function updateTimers() {
    const now = new Date();
    const elapsed = Math.floor((now - activationStart) / 1000);
    const remaining = Math.max(countdownSeconds - elapsed, 0);

    const options = {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: true
    };

    currentTimeEl.textContent = now.toLocaleString('en-US', options);
    elapsedTimeEl.textContent = formatTime(elapsed);
    countdownEl.textContent = remaining === 0 ? "EXPIRED" : formatTime(remaining);
  }

  setInterval(updateTimers, 1000);
  updateTimers();

  const overlay = document.getElementById('overlay');
  const pickupSelect = document.getElementById('pickupSelect');
  const dropoffSelect = document.getElementById('dropoffSelect');
  const colorGrid = document.getElementById('colorGrid');
  const continueBtn = document.getElementById('continueBtn');
  const routeText = document.getElementById('routeText');
  const openOverlayBtn = document.getElementById('openOverlayBtn');
  const root = document.documentElement;

  let chosenColor = "#1530B1";

  colorGrid.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-swatch');
    if(!sw) return;
    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
    sw.classList.add('selected');
    chosenColor = sw.dataset.color;
    root.style.setProperty('--ticket-bg', chosenColor);
    root.style.setProperty('--accent', chosenColor); // update accent (line & circle)
  });

  function applySelectionsAndClose(){
    const pickup = pickupSelect.value;
    const dropoff = dropoffSelect.value;
    routeText.textContent = `${pickup} to ${dropoff}`;
    root.style.setProperty('--ticket-bg', chosenColor || '#1530B1');
    root.style.setProperty('--accent', chosenColor || '#2D4CEB');

    const isDark = isColorDark(chosenColor || '#1530B1');
    root.style.setProperty('--text-on-ticket', isDark ? '#ffffff' : '#000000');

    overlay.classList.add('hidden');
    setTimeout(() => overlay.style.display = 'none', 300);
  }

  continueBtn.addEventListener('click', () => {
    applySelectionsAndClose();
  });

  openOverlayBtn.addEventListener('click', () => {
    overlay.style.display = 'flex';
    setTimeout(()=> overlay.classList.remove('hidden'), 10);
  });

  root.style.setProperty('--ticket-bg', chosenColor);
  root.style.setProperty('--text-on-ticket', '#ffffff');
  root.style.setProperty('--accent', chosenColor);

  function isColorDark(hex) {
    if(!hex) return true;
    hex = hex.replace('#','');
    if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
    const r = parseInt(hex.substr(0,2),16);
    const g = parseInt(hex.substr(2,2),16);
    const b = parseInt(hex.substr(4,2),16);
    const luminance = (0.2126*r + 0.7152*g + 0.0722*b);
    return luminance < 150;
  }

  pickupSelect.addEventListener('change', validateRoute);
  dropoffSelect.addEventListener('change', validateRoute);

  function validateRoute(){
    const p = pickupSelect.value;
    const d = dropoffSelect.value;
    if(p === d){
      pickupSelect.style.borderColor = '#e07b7b';
      dropoffSelect.style.borderColor = '#e07b7b';
      setTimeout(()=> {
        pickupSelect.style.borderColor = '';
        dropoffSelect.style.borderColor = '';
      }, 1300);
    }
  }

  routeText.textContent = `${pickupSelect.value} to ${dropoffSelect.value}`;
</script>
</body>
</html>
